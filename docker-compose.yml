# Uso:
#   docker compose up --build -d        # frontend + backend + postgres + redis
#   docker compose --profile storage up -d  # agrega MinIO (requiere imagen)
#   docker compose down                 # detiene y conserva los volumenes
#   docker compose down -v              # elimina tambien los datos persistidos
#
# Las credenciales NO viven en este archivo: se interpolan desde .env
# (ignorado por git). Copie .env.example a .env y ajuste los valores.
# ==============================================================================

