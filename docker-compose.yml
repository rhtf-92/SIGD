services:
  # 1. Base de Datos Relacional y Extensiones Criptográficas
  postgres:
    image: postgres:18-alpine
    container_name: sigd_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: sigd_prueba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigd_prueba"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Almacenamiento de Objetos Compatible con Amazon S3
  minio:
    image: minio/minio:latest
    container_name: sigd_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola Web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Almacén Clave-Valor en Memoria para Cache y Sesiones
  redis:
    image: redis:7-alpine
    container_name: sigd_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. API Backend y Worker Asíncrono de Auditoría Outbox
  backend:
    image: node:20-alpine
    container_name: sigd_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres_password@postgres:5432/sigd_prueba
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: sigd-expedientes
      REDIS_URL: redis://redis:6379
      OUTBOX_POLL_INTERVAL_MS: 5000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Frontend Single Page Application (React 19 + Vite 6)
  frontend:
    image: node:20-alpine
    container_name: sigd_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_ENABLE_MOCKS: "false"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  redisdata:
