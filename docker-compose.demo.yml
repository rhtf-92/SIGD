name: sigd-iestp-suiza-demo

services:
  postgres:
    image: postgres:18-alpine
    container_name: sigd_demo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: sigd_prueba
    expose:
      - "5432"
    volumes:
      - pgdata_demo:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigd_prueba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigd_demo_redis
    expose:
      - "6379"
    volumes:
      - redisdata_demo:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    container_name: sigd_demo_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - demo_backend_modules:/app/node_modules
    command: >-
      sh -ec 'if [ ! -x node_modules/.bin/tsx ]; then npm install --no-audit --no-fund; fi;
      exec npm run dev'
    environment:
      PORT: 3000
      NODE_ENV: development
      DISABLE_EMBEDDED_VITE: "true"
      MIGRATE_ON_BOOT: "true"
      DATABASE_URL: postgres://postgres:postgres_password@postgres:5432/sigd_prueba
      REDIS_URL: redis://redis:6379
      OUTBOX_POLL_INTERVAL_MS: 5000
      FRONTEND_URL: http://localhost:5273
      CORS_ORIGIN: http://localhost:5273,http://localhost:5173
    ports:
      - "3080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:24.19.0-alpine
    container_name: sigd_demo_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - demo_frontend_modules:/app/node_modules
    command: >-
      sh -ec 'if [ ! -x node_modules/.bin/vite ]; then npm install --no-package-lock --no-audit --no-fund; fi;
      exec npm run dev -- --host 0.0.0.0 --port 5173'
    environment:
      VITE_API_BASE_URL: http://localhost:3080/api/v1
      VITE_ENABLE_MOCKS: "false"
    ports:
      - "5273:5173"
    depends_on:
      - backend

volumes:
  pgdata_demo:
  redisdata_demo:
  demo_backend_modules:
  demo_frontend_modules:
