name: ${ACADEMIC_PROJECT_NAME:-sigd-academico}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ACADEMIC_POSTGRES_PASSWORD:?}
      POSTGRES_DB: sigd_prueba
    ports:
      - "127.0.0.1:${ACADEMIC_POSTGRES_PORT:-5434}:5432"
    volumes:
      - academic_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigd_prueba"]
      interval: 5s
      timeout: 5s
      retries: 12

  restore:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${ACADEMIC_POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${ACADEMIC_APP_DB_PASSWORD:?}
    volumes:
      - ./academic-snapshot:/snapshot:ro
      - ./backend/migraciones:/migrations:ro
    entrypoint: ["sh", "/snapshot/restore.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${ACADEMIC_REDIS_PORT:-6380}:6379"
    volumes:
      - academic_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.17@sha256:186de7ef977a20343ee9a5544073f081976a29e2d29ecf8379891e7bf177fbe9
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${ACADEMIC_S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${ACADEMIC_S3_SECRET_KEY:?}
    ports:
      - "127.0.0.1:${ACADEMIC_S3_PORT:-9001}:8333"
      - "127.0.0.1:${ACADEMIC_S3_UI_PORT:-8889}:8888"
    volumes:
      - academic_s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  demo-seed:
    build:
      context: ./backend
      target: development
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./academic-snapshot:/snapshot:ro
      - academic_backend_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://sigd_app:${ACADEMIC_APP_DB_PASSWORD:?}@postgres:5432/sigd_prueba
      ACADEMIC_DEMO_PASSWORD: ${ACADEMIC_DEMO_PASSWORD:?}
    command: ["node", "/snapshot/seed-demo.mjs"]
    depends_on:
      restore:
        condition: service_completed_successfully
    restart: "no"

  s3-init:
    build:
      context: ./backend
      target: development
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./academic-snapshot:/snapshot:ro
      - academic_backend_modules:/app/node_modules
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${ACADEMIC_S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${ACADEMIC_S3_SECRET_KEY:?}
      S3_BUCKET: sigd-academico
    command: ["node", "/snapshot/init-s3.mjs"]
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: development
    working_dir: /app
    volumes:
      - ./backend:/app
      - academic_backend_modules:/app/node_modules
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgres://sigd_app:${ACADEMIC_APP_DB_PASSWORD:?}@postgres:5432/sigd_prueba
      AUTH_JWT_SECRET: ${ACADEMIC_JWT_SECRET:?}
      REFIRMA_WEBHOOK_SECRET: ${ACADEMIC_WEBHOOK_SECRET:?}
      CORS_ORIGIN: http://localhost:${ACADEMIC_FRONTEND_PORT:-5174},http://127.0.0.1:${ACADEMIC_FRONTEND_PORT:-5174}
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${ACADEMIC_S3_PORT:-9001}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${ACADEMIC_S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${ACADEMIC_S3_SECRET_KEY:?}
      S3_BUCKET: sigd-academico
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379
      MIGRATE_ON_BOOT: "false"
      MGD_REFRESH_ENABLED: "false"
      START_FRONTEND: "false"
    ports:
      - "127.0.0.1:${ACADEMIC_BACKEND_PORT:-3001}:3000"
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: development
    working_dir: /app
    volumes:
      - ./frontend:/app
      - academic_frontend_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${ACADEMIC_BACKEND_PORT:-3001}/api/v1
      VITE_ENABLE_MOCKS: "false"
    command: ["npm", "exec", "--", "vite", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:${ACADEMIC_FRONTEND_PORT:-5174}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  academic_pgdata:
  academic_redisdata:
  academic_s3data:
  academic_backend_modules:
  academic_frontend_modules:
